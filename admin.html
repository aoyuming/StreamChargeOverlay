<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>赞助后台管理</title>
  </head>
  <body>
    <main class="admin-shell">
      <header class="admin-header">
        <div>
          <h1>赞助后台管理</h1>
          <p>添加老板赞助、节目点单和目标金额，展示页会实时同步。</p>
        </div>
        <div class="summary-card">
          <span>当前启动资金</span>
          <strong>¥<span id="adminTotal">0</span></strong>
          <em id="adminStatus">未达成</em>
        </div>
        <div class="admin-top-controls">
          <form id="authForm" class="auth-form">
            <label>
              后台密码
              <input id="authPasswordInput" name="password" type="password" autocomplete="current-password" placeholder="普通或超级密码" required />
            </label>
            <button class="secondary-button" type="submit">登录</button>
            <button id="logoutButton" class="ghost-button" type="button">退出</button>
            <span id="authStatus" class="auth-status">未登录</span>
          </form>
          <div class="room-admin">
            <label>
              房间
              <select id="roomSelect" aria-label="选择房间">
                <option value="">选择房间</option>
              </select>
            </label>
            <form id="roomForm" class="room-form">
              <input id="roomNameInput" name="roomName" autocomplete="off" placeholder="新房间名" />
              <button class="secondary-button" type="submit">新增房间</button>
            </form>
            <div class="room-password-form">
              <input id="roomViewerPasswordInput" type="password" autocomplete="new-password" placeholder="本房间普通密码" />
              <button id="updateRoomViewerPasswordButton" class="secondary-button" type="button">修改普通密码</button>
            </div>
            <button id="deleteRoomButton" class="ghost-button danger" type="button">删除房间</button>
          </div>
        </div>
      </header>

      <section class="workspace-grid">
        <form id="sponsorForm" class="tool-panel">
          <h2>添加赞助节目</h2>
          <label>
            老板名
            <input name="bossName" autocomplete="off" placeholder="例如：黄金罐子商会" required />
          </label>
          <label>
            赞助金额
            <input name="amount" type="number" min="1" step="0.01" placeholder="188" required />
          </label>
          <label>
            点的节目
            <input name="programName" autocomplete="off" placeholder="例如：红眼竞速挑战" required />
          </label>
          <label>
            注释 / 指定职业或玩法
            <textarea name="note" rows="3" placeholder="例如：指定职业、玩法、惩罚规则，给主持人看的提示"></textarea>
          </label>
          <label class="checkbox-field">
            <input name="countsTowardCharge" type="checkbox" checked />
            <span>加入启动资金充能</span>
          </label>
          <div class="avatar-picker">
            <span id="avatarPreview" class="avatar-preview" aria-label="老板头像预览">头像</span>
            <input id="avatarFileInput" type="file" accept="image/*" hidden />
            <div class="avatar-picker-actions">
              <button id="chooseAvatarButton" class="ghost-button" type="button">选择图片</button>
              <button id="pasteAvatarButton" class="ghost-button" type="button">粘贴头像 Ctrl+V</button>
              <button id="clearAvatarButton" class="ghost-button" type="button">清除头像</button>
            </div>
          </div>
          <div id="formError" class="form-error" role="alert"></div>
          <button class="primary-button" type="submit">添加到榜单</button>
        </form>

        <aside class="side-stack">
          <form id="targetForm" class="tool-panel compact-panel">
            <h2>目标金额</h2>
            <label class="compact-input-field target-input-field">
              凑够多少开始
              <input id="targetAmountInput" name="targetAmount" type="number" min="1" step="1" required />
            </label>
            <label class="compact-input-field wide-field">
              宣传语
              <input
                id="sloganInput"
                name="slogan"
                maxlength="32"
                autocomplete="off"
                placeholder="赞助点将，名场面马上开演"
                required
              />
            </label>
            <label class="compact-input-field current-charge-field">
              当前启动资金
              <input id="currentChargeAmountInput" type="number" min="0" step="0.01" required />
            </label>
            <div class="charge-actions">
              <button id="updateCurrentChargeButton" class="secondary-button" type="button">保存资金</button>
              <button id="resetCurrentChargeButton" class="secondary-button" type="button">归0</button>
            </div>
            <button class="secondary-button" type="submit">更新设置</button>
            <button id="startDianjiangButton" class="primary-button" type="button">开始点将</button>
          </form>

          <section id="todayDisplayPanel" class="tool-panel records-panel today-display-panel">
            <div class="records-header">
              <h2>今日赞助节目榜单</h2>
              <button id="removeTodaySponsorsButton" class="ghost-button" type="button">一键移除今日展示</button>
            </div>
            <div id="todayDisplayList" class="today-display-list"></div>
          </section>
        </aside>

        <div class="right-stack">
          <section class="tool-panel records-panel">
            <div class="records-header">
              <h2>赞助记录</h2>
              <button id="deleteAllSponsorsButton" class="ghost-button danger" type="button">一键删除</button>
            </div>
            <div id="recordList" class="record-list"></div>
          </section>

          <section id="trashPanel" class="tool-panel records-panel trash-panel" hidden>
            <div class="records-header">
              <h2>回收站</h2>
              <span class="trash-hint">删除后保留 7 天，可还原或彻底删除</span>
              <button id="clearTrashButton" class="ghost-button danger" type="button">清空回收站</button>
            </div>
            <div id="trashList" class="record-list"></div>
          </section>
        </div>
      </section>
    </main>
    <script type="module" src="/src/client/admin-main.ts"></script>
  </body>
</html>
