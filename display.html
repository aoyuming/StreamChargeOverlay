<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1440, initial-scale=1" />
    <title>充能展示条</title>
  </head>
  <body>
    <main class="overlay-shell" aria-label="直播充能展示条">
      <section class="camera-slot" aria-label="摄像头预留区">
        <div class="room-selector">
          <select id="roomSelect" aria-label="选择房间" hidden>
            <option value="">选择房间</option>
          </select>
          <button id="roomCycleButton" class="room-cycle-button" type="button">选择房间</button>
          <a id="adminOpenButton" class="admin-open-button" href="/admin.html" target="_blank" rel="noopener">后台管理</a>
        </div>
        <span>摄像头区域</span>
      </section>

      <section class="panel charge-panel" aria-label="今日大哥节目榜单与充能进度">
        <div class="panel-title">今日大哥节目榜单</div>
        <div class="current-boss-card">
          <div class="current-boss-header" aria-hidden="true">
            <span class="current-boss-header-name">大哥名字</span>
            <span class="current-boss-header-program">点的节目</span>
            <span class="current-boss-header-note">备注</span>
            <span class="current-boss-header-amount" aria-hidden="true"></span>
          </div>
          <div class="current-boss-viewport">
            <ul id="currentBossList" class="current-boss-list"></ul>
          </div>
        </div>
        <div class="charge-progress-row">
          <span id="progressSlogan" class="charge-progress-label">充能进度</span>
          <strong id="progressPercent" class="charge-percent">0根（目标0根）</strong>
        </div>
        <div id="progressTrack" class="progress-track">
          <div id="progressFill" class="progress-fill"></div>
          <canvas id="progressEffectsCanvas" class="progress-effects-canvas" width="620" height="58"></canvas>
        </div>
      </section>

      <section class="panel ranking-panel">
        <div class="panel-title">大哥总榜</div>
        <ol id="rankingPinned" class="ranking-pinned"></ol>
        <div class="ticker-mask ranking-mask">
          <ol id="rankingList" class="ranking-list"></ol>
        </div>
      </section>

      <canvas id="stageEffectsCanvas" class="stage-effects-canvas" width="1920" height="1440"></canvas>
      <canvas id="burstParticles" class="burst-particles" width="1920" height="1440"></canvas>
      <div id="sponsorBurst" class="sponsor-burst" aria-live="polite">
        <span class="burst-kicker">新大哥入场</span>
        <span id="burstAvatar" class="burst-avatar"></span>
        <strong id="burstTitle"></strong>
        <em id="burstNote"></em>
      </div>
    </main>
    <script type="module" src="/src/client/display-main.ts"></script>
  </body>
</html>
